# Blender Extension Manifest
# Documentation: https://docs.blender.org/manual/en/dev/extensions/index.html

schema_version = "1.0.0"

id = "cherub_suite"
version = "0.2.0"
name = "Cherub Suite"
tagline = "Comprehensive pie menu system for fast modeling workflows"

description = """
Cherub Suite is a comprehensive modeling toolkit for Blender 5.1+ that provides quick radial menus (pie menus) and modeling utilities to streamline common mesh editing tasks.

Features:
• 9 customizable pie menus with 8-directional options each
• Fast proportional editing with 7 falloff variants
• UV editing tools with integrated seam marking and unwrapping
• One-click mirror workflows with delete-half operations
• Snap and transform utilities for quick modeling
• Built-in hotkey customization via addon preferences
• Supports Blender 5.1 and newer

The addon includes integrated versions of EdgeFlow and UVSquares for complete mesh editing capabilities.
"""

type = "add-on"
website = "https://github.com/luischerub/Cherub-Suite"
documentation = "https://github.com/luischerub/Cherub-Suite/wiki"
issue_tracker = "https://github.com/luischerub/Cherub-Suite/issues"
forums = "https://github.com/luischerub/Cherub-Suite/discussions"

maintainer = "Luís Cherubini"

license = ["GPL-3.0-or-later"]

permissions = []

# Minimum Blender version required
blender_version_min = "5.1.0"

# Python version requirement
python_min_version = "3.11"

tags = [
    "Modeling",
    "Mesh",
    "UV",
    "Productivity",
    "Pie Menu",
    "Workflow"
]

# File patterns to exclude from the package
exclude_patterns = [
    ".git",
    ".gitignore",
    ".github",
    "*.md",
    "README*",
    "CHANGELOG*",
    "LICENSE*",
    "__pycache__",
    "*.pyc",
    ".vscode",
    ".pytest_cache"
]

# Wheels/dependencies (optional, for future use)
wheels = []

# This extension is on the Blender Extensions Platform
support = "COMMUNITY"
