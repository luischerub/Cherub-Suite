name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  bump-version:
    runs-on: ubuntu-latest
    name: Bump ${{ inputs.version_type }} Version
    
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install toml semver

      - name: Bump Version
        id: bump
        run: |
          python3 << 'EOF'
          import toml
          from semver import VersionInfo
          import sys
          
          version_type = "${{ inputs.version_type }}"
          
          # Read .blender_ext.toml
          with open('.blender_ext.toml', 'r') as f:
              manifest = toml.load(f)
          
          current_version = manifest['version']
          print(f"Current version: {current_version}")
          
          # Parse and bump version
          v = VersionInfo.parse(current_version)
          
          if version_type == 'major':
              new_version = v.bump_major()
          elif version_type == 'minor':
              new_version = v.bump_minor()
          elif version_type == 'patch':
              new_version = v.bump_patch()
          else:
              print(f"Invalid version type: {version_type}")
              sys.exit(1)
          
          new_version_str = str(new_version)
          print(f"New version: {new_version_str}")
          
          # Update .blender_ext.toml
          manifest['version'] = new_version_str
          with open('.blender_ext.toml', 'w') as f:
              toml.dump(manifest, f)
          
          # Update manifest.toml
          with open('manifest.toml', 'r') as f:
              manifest_data = f.read()
          
          manifest_data = manifest_data.replace(
              f'version = "{current_version}"',
              f'version = "{new_version_str}"'
          )
          
          with open('manifest.toml', 'w') as f:
              f.write(manifest_data)
          
          # Update __init__.py bl_info
          with open('__init__.py', 'r') as f:
              init_data = f.read()
          
          # Parse version tuple from current
          version_parts = current_version.split('.')
          new_parts = new_version_str.split('.')
          old_tuple = f"({version_parts[0]}, {version_parts[1]}, {version_parts[2]})"
          new_tuple = f"({new_parts[0]}, {new_parts[1]}, {new_parts[2]})"
          
          init_data = init_data.replace(f'"version": {old_tuple}', f'"version": {new_tuple}')
          
          with open('__init__.py', 'w') as f:
              f.write(init_data)
          
          # Output for next steps
          with open('version.txt', 'w') as f:
              f.write(new_version_str)
          
          print(f"✓ Version bumped: {current_version} → {new_version_str}")
          EOF

      - name: Read New Version
        id: version
        run: |
          VERSION=$(cat version.txt)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "chore: bump version to ${{ steps.version.outputs.version }}"
          title: "chore: bump version to ${{ steps.version.outputs.version }}"
          body: |
            ## Version Bump
            
            Bumped **${{ inputs.version_type }}** version to **${{ steps.version.outputs.version }}**
            
            Updated files:
            - `.blender_ext.toml`
            - `manifest.toml`
            - `__init__.py`
            
            After merging, create a release tag with: `git tag v${{ steps.version.outputs.version }}`
          branch: version-bump/${{ steps.version.outputs.version }}
          delete-branch: true
          labels: "release"
